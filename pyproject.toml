[project]
name = "rosetta-research-agent"
version = "1.0.0"
description = "Multi-language AI financial research agent. Enterprise API for structured investment thesis generation across 5 regional desks."
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Mihai Chindris", email = "mc146@students.quantic.edu"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "adalflow>=0.2.0",
    "python-dotenv>=1.0.0",
    "groq>=0.11.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "yfinance>=0.2.40",
    "akshare>=1.14.0",
]

[project.optional-dependencies]
full = [
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "tushare>=1.4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
